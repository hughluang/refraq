name: refraq-prod

# Site template. Copy this file and deploy/.env.example to a directory
# outside the git tree. Images are linux/amd64 only.
# Pin the version with REFRAQ_VERSION (no v prefix). Do not use latest.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refraq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: refraq
      TZ: UTC
    volumes:
      - refraq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refraq -d refraq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - refraq_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/hughluang/refraq-api:${REFRAQ_VERSION}
    environment:
      REFRAQ_ENV: prod
      REFRAQ_API_HOST: 0.0.0.0
      REFRAQ_API_PORT: 8000
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      REFRAQ_SECRETS_MASTER_KEY: ${REFRAQ_SECRETS_MASTER_KEY}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      INITIAL_ADMIN_ACCOUNT: ${INITIAL_ADMIN_ACCOUNT:-root}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      REFRAQ_BROWSER_FACING_HOST: ${REFRAQ_BROWSER_FACING_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ghcr.io/hughluang/refraq-api:${REFRAQ_VERSION}
    command: ["celery", "-A", "backend.worker.app", "worker"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      REFRAQ_SECRETS_MASTER_KEY: ${REFRAQ_SECRETS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # Run exactly one Beat replica (Postgres Scheduled Task SSOT; do not scale).
  beat:
    image: ghcr.io/hughluang/refraq-api:${REFRAQ_VERSION}
    command: ["celery", "-A", "backend.worker.app", "beat"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  mcp:
    image: ghcr.io/hughluang/refraq-api:${REFRAQ_VERSION}
    command: ["python", "-m", "backend.metadata.mcp_http"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_STORE_BACKEND: persistent
      REFRAQ_MCP_HOST: 0.0.0.0
      REFRAQ_MCP_PORT: 8001
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      REFRAQ_SECRETS_MASTER_KEY: ${REFRAQ_SECRETS_MASTER_KEY}
      REFRAQ_QUERY_TIMEOUT_SEC: ${REFRAQ_QUERY_TIMEOUT_SEC:-30}
      REFRAQ_QUERY_MAX_ROWS: ${REFRAQ_QUERY_MAX_ROWS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ghcr.io/hughluang/refraq-web:${REFRAQ_VERSION}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      REFRAQ_API_UPSTREAM: http://api:8000
      REFRAQ_MCP_UPSTREAM: http://mcp:8001
      REFRAQ_QUERY_TIMEOUT_SEC: ${REFRAQ_QUERY_TIMEOUT_SEC:-30}
      REFRAQ_BROWSER_FACING_PROTO: ${REFRAQ_BROWSER_FACING_PROTO:-http}
      REFRAQ_BROWSER_FACING_HOST: ${REFRAQ_BROWSER_FACING_HOST:-}
    ports:
      - "${REFRAQ_WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy

volumes:
  refraq_pg:
  refraq_redis:
