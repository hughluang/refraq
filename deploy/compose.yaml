name: refraq-prod

# Site compose template. Not a live site file. Do not start a site from
# deploy/. Runnable compose is a GitHub Release attachment after publish
# stamps the image-tag sentinel with the version (no v prefix).
# Images are linux/amd64 only.

services:
  postgres:
    image: pgvector/pgvector:pg18
    # ADR 0040: database supply is part of the capacity contract.
    # shared_buffers must fit in the container shm (default 64MB is too small).
    shm_size: "2gb"
    # Relative I/O preference under contention. Not an IOPS cap or latency guarantee.
    blkio_config:
      weight: 500
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
    environment:
      POSTGRES_USER: refraq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: refraq
      TZ: UTC
    # Named volume refraq_pg holds the PG18 cluster at the image VOLUME
    # /var/lib/postgresql. Default PGDATA is /var/lib/postgresql/18/docker.
    # /var/lib/postgresql/data is not the data directory.
    volumes:
      - refraq_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refraq -d refraq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # POSTGRES_DB only creates `refraq`. Entity Tables live in `refraq_entity`
  # on the same instance. This one-shot is required on every up, including
  # an already-initialized volume (initdb.d would not run again). It creates
  # the database when missing and runs the idempotent entity bootstrap
  # (roles, schemas, acl functions, move from public, RLS). Only this service
  # holds the administrative entity URL.
  ensure-entity-db:
    image: ghcr.io/hughluang/refraq-api:__REFRAQ_RELEASE_TAG__
    command: ["python", "-m", "backend.entity.bootstrap", "--create-database"]
    environment:
      TZ: UTC
      ENTITY_ADMIN_DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq_entity
      ENTITY_DATABASE_URL: postgresql+psycopg://refraq_entity_owner:${ENTITY_OWNER_PASSWORD:?set ENTITY_OWNER_PASSWORD}@postgres:5432/refraq_entity
      ENTITY_READER_DATABASE_URL: postgresql+psycopg://refraq_reader:${ENTITY_READER_PASSWORD:?set ENTITY_READER_PASSWORD}@postgres:5432/refraq_entity
      ENTITY_SIGNER_DATABASE_URL: postgresql+psycopg://refraq_signer:${ENTITY_SIGNER_PASSWORD:?set ENTITY_SIGNER_PASSWORD}@postgres:5432/refraq_entity
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - refraq_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/hughluang/refraq-api:__REFRAQ_RELEASE_TAG__
    environment:
      REFRAQ_ENV: prod
      REFRAQ_PROCESS_ROLE: api
      REFRAQ_API_HOST: 0.0.0.0
      REFRAQ_API_PORT: 8000
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      ENTITY_DATABASE_URL: postgresql+psycopg://refraq_entity_owner:${ENTITY_OWNER_PASSWORD:?set ENTITY_OWNER_PASSWORD}@postgres:5432/refraq_entity
      ENTITY_READER_DATABASE_URL: postgresql+psycopg://refraq_reader:${ENTITY_READER_PASSWORD:?set ENTITY_READER_PASSWORD}@postgres:5432/refraq_entity
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      REFRAQ_SECRETS_MASTER_KEY: ${REFRAQ_SECRETS_MASTER_KEY}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      INITIAL_ADMIN_ACCOUNT: ${INITIAL_ADMIN_ACCOUNT:-root}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      REFRAQ_BROWSER_FACING_HOST: ${REFRAQ_BROWSER_FACING_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ensure-entity-db:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ghcr.io/hughluang/refraq-api:__REFRAQ_RELEASE_TAG__
    command: ["celery", "-A", "backend.worker.app", "worker"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_PROCESS_ROLE: worker
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      ENTITY_DATABASE_URL: postgresql+psycopg://refraq_entity_owner:${ENTITY_OWNER_PASSWORD:?set ENTITY_OWNER_PASSWORD}@postgres:5432/refraq_entity
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      REFRAQ_SECRETS_MASTER_KEY: ${REFRAQ_SECRETS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      ensure-entity-db:
        condition: service_completed_successfully

  # Run exactly one Beat replica (Postgres Scheduled Task SSOT; do not scale).
  beat:
    image: ghcr.io/hughluang/refraq-api:__REFRAQ_RELEASE_TAG__
    restart: unless-stopped
    command: ["celery", "-A", "backend.worker.app", "beat"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_PROCESS_ROLE: worker
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  mcp:
    image: ghcr.io/hughluang/refraq-api:__REFRAQ_RELEASE_TAG__
    command: ["python", "-m", "backend.metadata.mcp_http"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_PROCESS_ROLE: mcp
      REFRAQ_STORE_BACKEND: persistent
      REFRAQ_MCP_HOST: 0.0.0.0
      REFRAQ_MCP_PORT: 8001
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      REFRAQ_SECRETS_MASTER_KEY: ${REFRAQ_SECRETS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  entity-mcp:
    image: ghcr.io/hughluang/refraq-api:__REFRAQ_RELEASE_TAG__
    command: ["python", "-m", "backend.entity.mcp.http"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_PROCESS_ROLE: entity_mcp
      REFRAQ_STORE_BACKEND: persistent
      REFRAQ_ENTITY_MCP_HOST: 0.0.0.0
      REFRAQ_ENTITY_MCP_PORT: 8002
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:${POSTGRES_PASSWORD}@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      ENTITY_READER_DATABASE_URL: postgresql+psycopg://refraq_reader:${ENTITY_READER_PASSWORD:?set ENTITY_READER_PASSWORD}@postgres:5432/refraq_entity
      ENTITY_SIGNER_DATABASE_URL: postgresql+psycopg://refraq_signer:${ENTITY_SIGNER_PASSWORD:?set ENTITY_SIGNER_PASSWORD}@postgres:5432/refraq_entity
      REFRAQ_SECRETS_MASTER_KEY: ${REFRAQ_SECRETS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ensure-entity-db:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ghcr.io/hughluang/refraq-web:__REFRAQ_RELEASE_TAG__
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      REFRAQ_API_UPSTREAM: http://api:8000
      REFRAQ_MCP_UPSTREAM: http://mcp:8001
      REFRAQ_ENTITY_MCP_UPSTREAM: http://entity-mcp:8002
      REFRAQ_BROWSER_FACING_PROTO: ${REFRAQ_BROWSER_FACING_PROTO:-http}
      REFRAQ_BROWSER_FACING_HOST: ${REFRAQ_BROWSER_FACING_HOST:-}
    ports:
      - "${REFRAQ_WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      entity-mcp:
        condition: service_healthy

  # Host network publishes 9100 on the host. Block that port from
  # everything except the Compose bridge; this file cannot withhold it.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    network_mode: host
    pid: host
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.diskstats
      - --collector.pressure
      - --collector.stat

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,network,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp

  # Idempotent: CREATE is skipped when the role exists, then ALTER and GRANT run again.
  ensure-monitor-role:
    image: pgvector/pgvector:pg18
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REFRAQ_MONITOR_PASSWORD: ${REFRAQ_MONITOR_PASSWORD:?set REFRAQ_MONITOR_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -eu
      - -c
      - |
        psql --host=postgres --username=refraq --dbname=refraq --set=ON_ERROR_STOP=1 \
          --set=monitor_password="$$REFRAQ_MONITOR_PASSWORD" <<'SQL'
        SELECT format(
          'CREATE ROLE refraq_monitor WITH LOGIN NOSUPERUSER PASSWORD %L',
          :'monitor_password'
        )
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'refraq_monitor'
        )
        \gexec
        ALTER ROLE refraq_monitor WITH LOGIN NOSUPERUSER PASSWORD :'monitor_password';
        GRANT pg_monitor TO refraq_monitor;
        SQL

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://refraq_monitor:${REFRAQ_MONITOR_PASSWORD:?set REFRAQ_MONITOR_PASSWORD}@postgres:5432/refraq?sslmode=disable
      PG_EXPORTER_COLLECTION_TIMEOUT: 8s
    depends_on:
      ensure-monitor-role:
        condition: service_completed_successfully
    command:
      - --collector.settings
      - --collector.stat_database
      - --collector.stat_activity
      - --collector.stat_checkpointer
      - --no-collector.buffercache_summary
      - --no-collector.database
      - --no-collector.database_wraparound
      - --no-collector.locks
      - --no-collector.long_running_transactions
      - --no-collector.postmaster
      - --no-collector.process_idle
      - --no-collector.replication
      - --no-collector.replication_slots
      - --no-collector.roles
      - --no-collector.stat_activity_autovacuum
      - --no-collector.stat_archiver
      - --no-collector.stat_bgwriter
      - --no-collector.stat_progress_vacuum
      - --no-collector.stat_replication
      - --no-collector.stat_statements
      - --no-collector.stat_user_tables
      - --no-collector.stat_wal_receiver
      - --no-collector.statio_user_indexes
      - --no-collector.statio_user_tables
      - --no-collector.wal
      - --no-collector.xlog_location

  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.1
    command:
      - --storage.tsdb.path=/prometheus
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - refraq_prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    blkio_config:
      weight: 100

volumes:
  refraq_pg:
  refraq_redis:
  refraq_prometheus:
