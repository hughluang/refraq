services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refraq
      POSTGRES_PASSWORD: refraq
      POSTGRES_DB: refraq
      TZ: UTC
    volumes:
      - refraq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refraq -d refraq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - refraq_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      REFRAQ_ENV: prod
      REFRAQ_API_HOST: 0.0.0.0
      REFRAQ_API_PORT: 8000
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:refraq@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      REFRAQ_SECRETS_MASTER_KEY: change-me-secrets-master-key
      REFRAQ_JOB_WORKER_CONCURRENCY: "1"
      ADMIN_SESSION_SECRET: change-me-in-production
      ADMIN_SESSION_TTL_HOURS: 8
      INITIAL_ADMIN_ACCOUNT: root
      INITIAL_ADMIN_PASSWORD: change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      [
        "celery",
        "-A",
        "backend.worker.app",
        "worker",
        "--concurrency=1",
      ]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:refraq@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      REFRAQ_SECRETS_MASTER_KEY: change-me-secrets-master-key
      REFRAQ_JOB_WORKER_CONCURRENCY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # Run exactly one Beat replica (Postgres Scheduled Task SSOT; do not scale).
  beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.worker.app", "beat"]
    environment:
      REFRAQ_ENV: prod
      REFRAQ_STORE_BACKEND: persistent
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://refraq:refraq@postgres:5432/refraq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        REFRAQ_API_UPSTREAM: http://api:8000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      # Remap the host side if 3000 is already in use locally.
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  refraq_pg:
  refraq_redis:
