name: Ensure site release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing release for latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} exists"
            exit 0
          fi
          cp deploy/compose.yaml docker-compose.yaml
          cp deploy/.env.example .env.example
          gh release create "$TAG" docker-compose.yaml .env.example \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
