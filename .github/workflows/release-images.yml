name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/refraq-api:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REFRAQ_API_UPSTREAM=http://api:8000
          tags: ghcr.io/${{ github.repository_owner }}/refraq-web:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Confirm image manifests
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/refraq-api:${{ steps.version.outputs.tag }}"
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/refraq-web:${{ steps.version.outputs.tag }}"

      - name: Stamp site files
        run: |
          python3 .github/scripts/stamp_site_compose.py \
            --version "${{ steps.version.outputs.tag }}" \
            --input deploy/compose.yaml \
            --output docker-compose.yaml
          cp deploy/.env.example .env.example

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            docker-compose.yaml
            .env.example
          generate_release_notes: true
