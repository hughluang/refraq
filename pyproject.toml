[tool.ruff]
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
# Time contract: flake8-datetimez. Enabled for production + tests (wave 3 cutover).
select = [
  "DTZ001",
  "DTZ003",
  "DTZ004",
  "DTZ005",
  "DTZ006",
  "DTZ007",
]

[tool.ruff.lint.per-file-ignores]
# Alembic historical revisions may still mention naive constructors in comments/SQL only.
"backend/alembic/versions/*" = ["DTZ001", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ007"]
