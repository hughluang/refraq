services:
  postgres:
    image: pgvector/pgvector:pg18
    shm_size: "2gb"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
    environment:
      POSTGRES_USER: refraq
      POSTGRES_PASSWORD: refraq
      POSTGRES_DB: refraq
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refraq -d refraq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # POSTGRES_DB only creates `refraq`. Entity Tables live in `refraq_entity`
  # on the same instance. This one-shot is required on every up, including
  # an already-initialized volume (initdb.d would not run again).
  ensure-entity-db:
    image: pgvector/pgvector:pg18
    environment:
      PGPASSWORD: refraq
      TZ: UTC
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        until pg_isready -h postgres -U refraq -d refraq; do sleep 1; done
        if ! psql -h postgres -U refraq -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='refraq_entity'" | grep -q 1; then
          psql -h postgres -U refraq -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE refraq_entity"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
